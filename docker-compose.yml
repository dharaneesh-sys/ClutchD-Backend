services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: clutchd
      POSTGRES_PASSWORD: clutchd
      POSTGRES_DB: clutchd
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clutchd -d clutchd"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 45s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"

  # PRODUCTION API RUNS ON THE HOST via systemd (clutchd-api.service, :8000).
  # Caddy (:8080) proxies to 127.0.0.1:8000 — NOT to this container.
  # This container is opt-in only (docker compose --profile docker-api up api)
  # for local testing; plain `up`/`restart` can never start it, so a deploy
  # can never accidentally "restart the backend" that was actually serving
  # production traffic on the wrong process.
  api:
    profiles: ["docker-api"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://clutchd:clutchd@db:5432/clutchd
      SYNC_DATABASE_URL: postgresql://clutchd:clutchd@db:5432/clutchd
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-950f7a372d6647e83034d1a92325cf5d62f78702ecee0d9f2335036a030011cf}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,https://clutchd.com,https://api.clutchd.com
      DEV_AUTO_VERIFY_PROVIDERS: "false"
      SEARCH_RADIUS_KM: "25"
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Celery worker is idle (exited) — the host API runs tasks inline.
  # Kept opt-in under the same profile so `docker compose up` doesn't
  # try to (re)build/start services production doesn't use.
  worker:
    profiles: ["docker-api"]
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    restart: "no"
    environment:
      DATABASE_URL: postgresql+asyncpg://clutchd:clutchd@db:5432/clutchd
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-950f7a372d6647e83034d1a92325cf5d62f78702ecee0d9f2335036a030011cf}
      SEARCH_RADIUS_KM: "25"
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
    command: celery -A app.tasks.worker.celery_app worker --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
