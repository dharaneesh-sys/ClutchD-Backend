[Unit]
Description=sshd: always restart when killed (ClutchD direct-SSH lifeline)
# Stock Ubuntu ssh.service uses Restart=on-failure + RestartPreventExitStatus=255.
# A manual kill (TERM) makes sshd exit 0 or 255 → no restart either way.
# LAN IP (192.168.1.8:22) is the emergency path when Tailscale is down,
# so sshd must come back no matter how it died. (ssh.socket is inactive
# on this box — the daemon owns :22.)

[Service]
Restart=always
RestartSec=3
RestartPreventExitStatus=
